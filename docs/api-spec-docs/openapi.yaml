openapi: 3.0.3
info:
  title: Masjid App API
  description: |
    API for Masjid Application - Prayer times, events, announcements, campaigns, and donations management.
    
    ## Authentication
    - **Admin APIs**: JWT Bearer Token in Authorization header
    - **Member APIs**: API Key in X-API-Key header
    - **Webhooks**: Stripe signature verification
    
    ## Rate Limits
    - Admin APIs: 100 requests/minute per user
    - Member APIs: 60 requests/minute per API key
    - Auth endpoints: 10 requests/minute per IP
  version: 1.0.0
  contact:
    name: Masjid App Support
    email: support@masjid-app.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.{masjid-domain}.com/api/v1
    description: Production server

tags:
  - name: Admin Auth
    description: Admin authentication endpoints
  - name: Admin Prayer Times
    description: Prayer times management
  - name: Admin Events
    description: Events management
  - name: Admin Announcements
    description: Announcements management
  - name: Admin Campaigns
    description: Campaign management
  - name: Admin Settings
    description: Masjid settings management
  - name: Admin Users
    description: Admin user management (Super Admin only)
  - name: Member Prayer Times
    description: Prayer times for mobile app
  - name: Member Events
    description: Events for mobile app
  - name: Member Campaigns
    description: Campaigns and donations for mobile app
  - name: Member Masjid
    description: Masjid information for mobile app
  - name: Member Devices
    description: Device registration and preferences
  - name: Webhooks
    description: External service webhooks

paths:
  # ============================================
  # ADMIN AUTH ENDPOINTS
  # ============================================
  /admin/auth/login:
    post:
      tags:
        - Admin Auth
      summary: Admin login
      description: Authenticate admin user and receive JWT tokens
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          headers:
            Set-Cookie:
              description: Refresh token cookie
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLockedError'

  /admin/auth/refresh:
    post:
      tags:
        - Admin Auth
      summary: Refresh access token
      description: Get new access token using refresh token cookie
      operationId: adminRefreshToken
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/auth/logout:
    post:
      tags:
        - Admin Auth
      summary: Admin logout
      description: Invalidate refresh token and clear cookies
      operationId: adminLogout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /admin/auth/me:
    get:
      tags:
        - Admin Auth
      summary: Get current user
      description: Get details of currently authenticated admin user
      operationId: getCurrentAdmin
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/auth/change-password:
    put:
      tags:
        - Admin Auth
      summary: Change password
      description: Change current user's password
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================
  # ADMIN PRAYER TIMES ENDPOINTS
  # ============================================
  /admin/prayer-times:
    get:
      tags:
        - Admin Prayer Times
      summary: List prayer times
      description: Get prayer times with pagination and date filters
      operationId: listPrayerTimes
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of prayer times
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrayerTimesListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Admin Prayer Times
      summary: Create prayer time
      description: Create prayer time entry for a specific date
      operationId: createPrayerTime
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrayerTimeRequest'
      responses:
        '201':
          description: Prayer time created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrayerTimeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Prayer time for this date already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/prayer-times/bulk:
    post:
      tags:
        - Admin Prayer Times
      summary: Bulk create/update prayer times
      description: Create or update multiple prayer times (for importing monthly timetables)
      operationId: bulkCreatePrayerTimes
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkPrayerTimesRequest'
      responses:
        '200':
          description: Bulk operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/prayer-times/{id}:
    get:
      tags:
        - Admin Prayer Times
      summary: Get prayer time
      description: Get single prayer time entry by ID
      operationId: getPrayerTime
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Prayer time details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrayerTimeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Admin Prayer Times
      summary: Update prayer time
      description: Update prayer time entry
      operationId: updatePrayerTime
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrayerTimeRequest'
      responses:
        '200':
          description: Prayer time updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrayerTimeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Admin Prayer Times
      summary: Delete prayer time
      description: Delete prayer time entry
      operationId: deletePrayerTime
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Prayer time deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
  # ADMIN EVENTS ENDPOINTS
  # ============================================
  /admin/events:
    get:
      tags:
        - Admin Events
      summary: List events
      description: Get all events with filters and pagination
      operationId: listEvents
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EventStatus'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/EventCategory'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: search
          in: query
          description: Search in title/description
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Admin Events
      summary: Create event
      description: Create new event
      operationId: createEvent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/events/{id}:
    get:
      tags:
        - Admin Events
      summary: Get event
      description: Get single event by ID
      operationId: getEvent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Admin Events
      summary: Update event
      description: Update event details
      operationId: updateEvent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Admin Events
      summary: Delete event
      description: Delete event (only draft events)
      operationId: deleteEvent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Event deleted
        '400':
          description: Cannot delete non-draft event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/events/{id}/status:
    patch:
      tags:
        - Admin Events
      summary: Update event status
      description: Update event status (publish, cancel, complete)
      operationId: updateEventStatus
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/events/{id}/notify:
    post:
      tags:
        - Admin Events
      summary: Send event notification
      description: Send push notification for event to all registered devices
      operationId: notifyEvent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Notification sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSentResponse'
        '400':
          description: Event not published or notification already sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/events/{id}/image:
    post:
      tags:
        - Admin Events
      summary: Upload event image
      description: Upload featured image for event
      operationId: uploadEventImage
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG, WebP, max 5MB)
              required:
                - image
      responses:
        '200':
          description: Image uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
        '400':
          description: Invalid image file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
  # ADMIN ANNOUNCEMENTS ENDPOINTS
  # ============================================
  /admin/announcements:
    get:
      tags:
        - Admin Announcements
      summary: List announcements
      description: Get all announcements with filters and pagination
      operationId: listAnnouncements
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AnnouncementStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of announcements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Admin Announcements
      summary: Create announcement
      description: Create and optionally send/schedule announcement
      operationId: createAnnouncement
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnnouncementRequest'
      responses:
        '201':
          description: Announcement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/announcements/{id}:
    get:
      tags:
        - Admin Announcements
      summary: Get announcement
      description: Get single announcement by ID
      operationId: getAnnouncement
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Announcement details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Admin Announcements
      summary: Update announcement
      description: Update announcement (only draft/scheduled)
      operationId: updateAnnouncement
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnnouncementRequest'
      responses:
        '200':
          description: Announcement updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Admin Announcements
      summary: Delete announcement
      description: Delete announcement (only draft)
      operationId: deleteAnnouncement
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Announcement deleted
        '400':
          description: Cannot delete non-draft announcement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/announcements/{id}/send:
    post:
      tags:
        - Admin Announcements
      summary: Send announcement
      description: Send a draft announcement immediately
      operationId: sendAnnouncement
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Announcement sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSentResponse'
        '400':
          description: Announcement already sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/announcements/{id}/cancel:
    post:
      tags:
        - Admin Announcements
      summary: Cancel scheduled announcement
      description: Cancel a scheduled announcement
      operationId: cancelAnnouncement
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Announcement cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementResponse'
        '400':
          description: Announcement not scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
  # ADMIN CAMPAIGNS ENDPOINTS
  # ============================================
  /admin/campaigns:
    get:
      tags:
        - Admin Campaigns
      summary: List campaigns
      description: Get all campaigns with filters and pagination
      operationId: listCampaigns
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CampaignStatus'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/CampaignCategory'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of campaigns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Admin Campaigns
      summary: Create campaign
      description: Create new fundraising campaign
      operationId: createCampaign
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/campaigns/{id}:
    get:
      tags:
        - Admin Campaigns
      summary: Get campaign
      description: Get single campaign with detailed stats
      operationId: getCampaign
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Campaign details with stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Admin Campaigns
      summary: Update campaign
      description: Update campaign details
      operationId: updateCampaign
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignRequest'
      responses:
        '200':
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Admin Campaigns
      summary: Delete campaign
      description: Delete campaign (only draft with no donations)
      operationId: deleteCampaign
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Campaign deleted
        '400':
          description: Cannot delete campaign with donations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/campaigns/{id}/status:
    patch:
      tags:
        - Admin Campaigns
      summary: Update campaign status
      description: Update campaign status (activate, pause, complete, cancel)
      operationId: updateCampaignStatus
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/CampaignStatus'
              required:
                - status
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/campaigns/{id}/donations:
    get:
      tags:
        - Admin Campaigns
      summary: List campaign donations
      description: Get donations for a specific campaign
      operationId: listCampaignDonations
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DonationStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of donations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/campaigns/{id}/image:
    post:
      tags:
        - Admin Campaigns
      summary: Upload campaign image
      description: Upload featured image for campaign
      operationId: uploadCampaignImage
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
                - image
      responses:
        '200':
          description: Image uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
        '400':
