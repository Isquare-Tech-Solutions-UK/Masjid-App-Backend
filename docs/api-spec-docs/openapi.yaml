components:
  # ============================================
  # SECURITY SCHEMES
  # ============================================
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for admin authentication

    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for mobile app authentication

  # ============================================
  # PARAMETERS
  # ============================================
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Resource UUID
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      description: Page number (0-indexed)
      schema:
        type: integer
        default: 0
        minimum: 0

    Size:
      name: size
      in: query
      description: Page size
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    Sort:
      name: sort
      in: query
      description: Sort field and direction (e.g., createdAt,desc)
      schema:
        type: string

    StartDate:
      name: startDate
      in: query
      description: Filter from date (YYYY-MM-DD)
      schema:
        type: string
        format: date

    EndDate:
      name: endDate
      in: query
      description: Filter to date (YYYY-MM-DD)
      schema:
        type: string
        format: date

  # ============================================
  # RESPONSES
  # ============================================
  responses:
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Missing or invalid authentication token
            meta:
              timestamp: "2026-01-29T08:00:00Z"
              requestId: req_abc123

    InvalidApiKey:
      description: Invalid or revoked API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_API_KEY
              message: Invalid or revoked API key
            meta:
              timestamp: "2026-01-29T08:00:00Z"
              requestId: req_abc123

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action
            meta:
              timestamp: "2026-01-29T08:00:00Z"
              requestId: req_abc123

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Resource not found
            meta:
              timestamp: "2026-01-29T08:00:00Z"
              requestId: req_abc123

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  # ============================================
  # SCHEMAS
  # ============================================
  schemas:
    # Common Schemas
    Meta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        meta:
          $ref: '#/components/schemas/Meta'

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
        meta:
          $ref: '#/components/schemas/Meta'

    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
        meta:
          $ref: '#/components/schemas/Meta'

    # Enums
    AdminRole:
      type: string
      enum:
        - super_admin
        - admin

    EventStatus:
      type: string
      enum:
        - draft
        - published
        - cancelled
        - completed

    EventCategory:
      type: string
      enum:
        - community
        - educational
        - fundraiser
        - religious
        - youth
        - other

    AnnouncementStatus:
      type: string
      enum:
        - draft
        - scheduled
        - sent
        - failed

    CampaignStatus:
      type: string
      enum:
        - draft
        - active
        - paused
        - completed
        - cancelled

    CampaignCategory:
      type: string
      enum:
        - masjid_development
        - education
        - charity
        - individual_support
        - general

    DonationStatus:
      type: string
      enum:
        - pending
        - completed
        - failed
        - refunded

    # Auth Schemas
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 8

    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken:
              type: string
            expiresIn:
              type: integer
              description: Token expiry in seconds
            user:
              $ref: '#/components/schemas/AdminUser'
        meta:
          $ref: '#/components/schemas/Meta'

    RefreshTokenResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken:
              type: string
            expiresIn:
              type: integer
        meta:
          $ref: '#/components/schemas/Meta'

    AccountLockedError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: ACCOUNT_LOCKED
            message:
              type: string
            lockedUntil:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/Meta'

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    # Admin User Schemas
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/AdminRole'
        isActive:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminUserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AdminUser'
        meta:
          $ref: '#/components/schemas/Meta'

    AdminUsersListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/Meta'

    CreateAdminUserRequest:
      type: object
      required:
        - username
        - email
        - fullName
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        fullName:
          type: string
          maxLength: 100
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/AdminRole'

    UpdateAdminUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
