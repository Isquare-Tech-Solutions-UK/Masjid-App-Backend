# Loki single-binary configuration for the Masjid App VPS.
# Filesystem storage, no clustering — sized for one host.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

limits_config:
  # Keep everything. Combined with `compactor.retention_enabled: false`
  # below, nothing is ever deleted. See docs/logging.md if you later want
  # to cap this (e.g. 2160h for 90 days).
  retention_period: 0s

  # Allow backfilling historical `docker logs` output, which carries
  # timestamps older than Loki's default acceptance window.
  reject_old_samples: false

  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

  # Defaults here are 5000 entries / 721h, which silently truncate
  # "show me everything" queries. Raised so full history is reachable.
  max_entries_limit_per_query: 100000
  max_query_length: 0s
  max_query_series: 5000

  volume_enabled: true
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: false
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false