# Single source of truth for the hostnames on the TLS certificate.
#
# One certificate carries all of them as SANs, which is why every nginx server
# block can reference the same path. PRIMARY must stay first and must not
# change: certbot names the lineage directory after it, and the
# ssl_certificate paths in nginx/conf.d/app.conf depend on that name.
#
# To add a subdomain:
#   1. create the DNS A record (see docs/godaddy-dns-setup.md)
#   2. add the hostname to DOMAINS below
#   3. add a server block to nginx/conf.d/app.conf
#   4. re-run scripts/tls/setup-tls.sh on the VPS — it detects the difference
#      and expands the certificate

PRIMARY="masjid-app.isquaretechsolutions.com"

DOMAINS="
masjid-app.isquaretechsolutions.com
api.masjid-app.isquaretechsolutions.com
logs.masjid-app.isquaretechsolutions.com
vault.masjid-app.isquaretechsolutions.com
s3.masjid-app.isquaretechsolutions.com
console.masjid-app.isquaretechsolutions.com
"

# Where the app stack is deployed. The ACME webroot lives under it and is
# bind-mounted into the nginx container by docker-compose.yml.
APP_DIR="${APP_DIR:-/root/masjid-app}"

# nginx container to reload after a renewal.
NGINX_CONTAINER="masjid-nginx"