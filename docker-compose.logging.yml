# Centralised logging stack: Loki (storage) + Alloy (collection) + Grafana (UI).
#
# Deployed by the CI workflow from ~/masjid-app as a SEPARATE compose project:
#
#   docker compose -p masjid-logging -f docker-compose.logging.yml up -d
#
# The explicit -p is what makes this safe. The app deploy runs
# --remove-orphans, which removes containers labelled with the masjid-app
# project; these carry masjid-logging instead, so they survive untouched. Do NOT
# run this file without -p, or the next app deploy will delete the whole stack.
#
# It is also brought up WITHOUT --force-recreate, so ordinary app deploys leave
# these containers running and ingesting rather than restarting them.
#
# Alloy reads the Docker socket directly, so it collects logs from every
# container on the host regardless of which project or network they belong to.
# Only Grafana strictly needs the app network — so nginx can proxy to it.

services:
  loki:
    image: grafana/loki:3.3.2
    container_name: masjid-loki
    restart: always
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./logging/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - masjid-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: masjid-alloy
    restart: always
    # Root is required to read /var/run/docker.sock; the image otherwise
    # runs as uid 473, which cannot open the socket.
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./logging/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persists read positions so a restart does not re-ingest or skip lines.
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - masjid-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: masjid-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Served behind nginx on its own subdomain, so Grafana sits at the root
      # and GF_SERVER_SERVE_FROM_SUB_PATH is no longer set (it must not be,
      # or Grafana would expect a /logs/ prefix that nginx no longer adds).
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://logs.masjid-app.isquaretechsolutions.com}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./logging/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - masjid-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  loki-data:
  alloy-data:
  grafana-data:

networks:
  # The network created by the app stack in ~/masjid-app. Compose derives the
  # name from the directory, so it is "<project>_masjid-network".
  # Verify with: docker network ls | grep masjid
  masjid-network:
    external: true
    name: ${MASJID_NETWORK:-masjid-app_masjid-network}