# Production environment (SPRING_PROFILES_ACTIVE=prod).
#
# Non-secret differences from application.yml only. Secrets and URLs come
# from Infisical. LOG_LEVEL_* set on the stack or in Infisical still win over
# the defaults below.

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    com.masjidapp: ${LOG_LEVEL_APP:INFO}

# The health endpoint is public. Report only UP/DOWN, not database and disk
# details. The container healthcheck only needs the status code.
management:
  endpoint:
    health:
      show-details: never

# No public API explorer in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
