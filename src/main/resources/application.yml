spring:
  application:
    name: masjid-app-backend
  servlet:

    multipart:
      enabled: true
      max-file-size: 10MB          # Per file limit
      max-request-size: 50MB       # Total for all files in one request
      file-size-threshold: 2KB

  # Database Configuration
  #
  # url, username and password are deliberately not set here: a missing value
  # must stop the app at startup ("'url' attribute is not specified") rather
  # than silently connect with a known password. Spring binds them from
  # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (Infisical or the compose
  # stack), or from application-local.yml for local development.
  datasource:
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# Server Configuration
server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    context-path: /api/v1

# JWT Configuration
#
# Required, no default. JwtConfig refuses to start if JWT_SECRET is missing.
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 1800000  # 30 minutes in milliseconds
  refresh-token-expiration: 604800000  # 7 days in milliseconds

# Logging
#
# Logs go to stdout as JSON so Alloy can ship them to Loki with `level`,
# `logger_name` and `requestId` as queryable fields. For readable output while
# developing locally, set LOG_STRUCTURED_FORMAT to an empty value.
#
# Levels are env-driven so they can be raised temporarily via Infisical
# without a code change or rebuild.
logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:logstash}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.masjidapp: ${LOG_LEVEL_APP:INFO}
    # DEBUG here logs authentication internals, including token and header
    # detail — keep it at WARN unless actively debugging an auth problem.
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}


minio:
  # Used by the MinIO SDK client for upload/download operations (may be a
  # Docker-internal or otherwise backend-only reachable address).
  # Required, no default.
  endpoint: ${MINIO_ENDPOINT}
  # Used only to build the object URLs returned to clients (must be reachable
  # from the browser/frontend). Falls back to minio.endpoint if not set.
  public-url: ${MINIO_PUBLIC_URL:${MINIO_ENDPOINT}}
  # Required, no default: a missing key must fail at startup, not fall back
  # to MinIO's well-known minioadmin/minioadmin.
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:masjid-app}
  secure: ${MINIO_SECURE:false}

app:
  s3:
    # Retained only so pre-migration image URLs stored in the DB can still be
    # recognized and deleted; these are not used for new uploads.
    legacy-bucket-name: ${AWS_LEGACY_BUCKET_NAME:masjid-app-media}
    legacy-region: ${AWS_LEGACY_REGION:ap-south-1}
  firebase:
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

  stripe:
    # Estimate of Stripe's processing fee, used to gross up the charge (donor pays
    # the fee so the charity nets the full donation). Not a platform fee.
    fee-percent: ${STRIPE_FEE_PERCENT:0.015}
    fee-fixed: ${STRIPE_FEE_FIXED:0.20}
  encryption:
    # Base64-encoded 256-bit AES key used to encrypt the charity's Stripe secret key
    # and webhook signing secret at rest. Required, no default: it MUST be set per
    # environment from a secrets manager and MUST NOT be reused across environments.
    master-key: ${ENCRYPTION_MASTER_KEY}

member:
  api:
    # Required, no default.
    key: ${MEMBER_API_KEY}

# Origins allowed to call the API cross-origin (comma-separated, wildcard
# patterns allowed). The masjidguide tenants call /api same-origin and do not
# need an entry. The default is the list in use before this was configurable.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://masjid-app.isquaretechsolutions.com,http://localhost:3000,https://masjid-app.vercel.app,https://*.vercel.app}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  override-with-generic-response: false

