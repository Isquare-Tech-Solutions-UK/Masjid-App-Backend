spring:
  application:
    name: masjid-app-backend
  servlet:

    multipart:
      enabled: true
      max-file-size: 10MB          # Per file limit
      max-request-size: 50MB       # Total for all files in one request
      file-size-threshold: 2KB

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/masjid_app
    username: ${DB_USERNAME:syedfardeen}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# Server Configuration
server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    context-path: /api/v1

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:Q2bI0hIuSeXGDTO1SaWmp6Scw1VaH/3zp0bxImJD85M=}
  access-token-expiration: 1800000  # 30 minutes in milliseconds
  refresh-token-expiration: 604800000  # 7 days in milliseconds

# Logging
logging:
  level:
    root: INFO
    com.masjidapp: DEBUG
    org.springframework.security: DEBUG


minio:
  # Used by the MinIO SDK client for upload/download operations (may be a
  # Docker-internal or otherwise backend-only reachable address).
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # Used only to build the object URLs returned to clients (must be reachable
  # from the browser/frontend). Falls back to minio.endpoint if not set.
  public-url: ${MINIO_PUBLIC_URL:${MINIO_ENDPOINT:http://localhost:9000}}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:masjid-app}
  secure: ${MINIO_SECURE:false}

app:
  s3:
    # Retained only so pre-migration image URLs stored in the DB can still be
    # recognized and deleted; these are not used for new uploads.
    legacy-bucket-name: ${AWS_LEGACY_BUCKET_NAME:masjid-app-media}
    legacy-region: ${AWS_LEGACY_REGION:ap-south-1}
  firebase:
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

  stripe:
    # Estimate of Stripe's processing fee, used to gross up the charge (donor pays
    # the fee so the charity nets the full donation). Not a platform fee.
    fee-percent: ${STRIPE_FEE_PERCENT:0.015}
    fee-fixed: ${STRIPE_FEE_FIXED:0.20}
  encryption:
    # Base64-encoded 256-bit AES key used to encrypt the charity's Stripe secret key
    # and webhook signing secret at rest. MUST be overridden per environment and MUST
    # NOT be reused across environments. The default below is DEV-ONLY — never use it
    # in production; supply ENCRYPTION_MASTER_KEY from a secrets manager instead.
    master-key: ${ENCRYPTION_MASTER_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

member:
  api:
    key: ${MEMBER_API_KEY:d4f8a1b2-7e3c-4f9a-b5d6-1a2b3c4d5e6f}

cors:
  allowed-origins: http://localhost:3000,https://masjid-app-frontend.vercel.app,https://masjid-app.vercel.app

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  override-with-generic-response: false

