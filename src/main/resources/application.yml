spring:
  application:
    name: masjid-app-backend
  servlet:

    multipart:
      enabled: true
      max-file-size: 10MB          # Per file limit
      max-request-size: 50MB       # Total for all files in one request
      file-size-threshold: 2KB

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/masjid_app
    username: ${DB_USERNAME:syedfardeen}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cloud:
    aws:
      region:
        static: ap-south-1
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# Server Configuration
server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    context-path: /api/v1

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:Q2bI0hIuSeXGDTO1SaWmp6Scw1VaH/3zp0bxImJD85M=}
  access-token-expiration: 1800000  # 30 minutes in milliseconds
  refresh-token-expiration: 604800000  # 7 days in milliseconds

# Logging
logging:
  level:
    root: INFO
    com.masjidapp: DEBUG
    org.springframework.security: DEBUG

app:
  s3:
    bucket-name: masjid-app-media
  firebase:
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}

member:
  api:
    key: ${MEMBER_API_KEY:d4f8a1b2-7e3c-4f9a-b5d6-1a2b3c4d5e6f}

cors:
  allowed-origins: http://localhost:3000,https://masjid-app-frontend.vercel.app,https://masjid-app.vercel.app

