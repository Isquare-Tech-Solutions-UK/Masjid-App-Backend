name: Deploy to Dev

on:
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Deployment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/masjid-backend:dev-latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: Deployment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create app directory on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: mkdir -p ~/masjid-app/nginx/conf.d

      - name: Copy docker-compose and nginx config to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "./docker-compose.dev.yml,./nginx/conf.d/app.conf"
          target: "~/masjid-app"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            cd ~/masjid-app
            # Stop old standalone nginx if running
            docker stop masjid-nginx 2>/dev/null && docker rm masjid-nginx 2>/dev/null || true
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            export DB_USERNAME=${{ secrets.DEV_DB_USERNAME }}
            export DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
            docker-compose -f docker-compose.dev.yml pull
            docker-compose -f docker-compose.dev.yml up -d
            docker image prune -f
