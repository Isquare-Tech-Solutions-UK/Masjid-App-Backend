name: Release

# Run by hand: Actions > Release > Run workflow, pick the branch, enter a
# version such as 1.4.0. It tags the commit backend-v<version> and publishes
# ghcr.io/isquare-tech-solutions-uk/masjidguide-backend:<version>.
#
# Publishing an image deploys nothing. Each Portainer stack picks a version
# explicitly.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, MAJOR.MINOR.PATCH (e.g. 1.4.0)"
        required: true
        type: string

permissions:
  contents: write   # push the release tag
  packages: write   # push the image to GHCR

# Two runs for the same version must not race each other to the tag.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/isquare-tech-solutions-uk/masjidguide-backend

jobs:
  release:
    runs-on: ubuntu-latest
    # The input reaches shell steps only through env, never interpolated into
    # `run:`, so a crafted version string cannot inject commands.
    env:
      VERSION: ${{ inputs.version }}
      TAG: backend-v${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like 1.4.0 (MAJOR.MINOR.PATCH), got: $VERSION"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      # Versions are immutable: a version that already has a tag is never
      # rebuilt, so a stack pinned to it always runs the same code.
      - name: Refuse if the tag already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists; choose a new version"
            exit 1
          fi

      # Tag first, so every published image has a tag in git pointing at the
      # exact source it was built from.
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Backend release $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          # The source label links the GHCR package to this repository, which
          # cleanup.yml's GITHUB_TOKEN needs in order to manage its versions.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Released backend $VERSION"
            echo ""
            echo "- Tag: \`$TAG\` at \`$GITHUB_SHA\`"
            echo "- Image: \`$IMAGE:$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
