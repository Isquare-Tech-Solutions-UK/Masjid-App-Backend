name: Masjid App Build & Deploy

on:
  push:
    branches:
      - dev
      - main

  # No environment input: there is one environment on one VPS. The previous
  # dev/staging/prod dropdown was decorative — the deploy always used
  # DEV_EC2_HOST and --env=dev regardless of the selection, which is how
  # someone eventually ships to what they think is staging.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Deployment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Two tags: dev-latest is the moving pointer the VPS pulls by default, and
      # the commit SHA is immutable. Without the SHA tag there is no way back to
      # a known-good build — dev-latest is overwritten by the next push.
      # To roll back: set BACKEND_TAG=<sha> in Infisical and redeploy.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/masjid-backend:dev-latest
            ${{ secrets.DOCKER_USERNAME }}/masjid-backend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: Deployment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create application directory
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            mkdir -p ~/masjid-app/nginx/conf.d \
                     ~/masjid-app/scripts/tls \
                     ~/masjid-app/logging/grafana/provisioning/datasources

      - name: Copy docker-compose and nginx config
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "./docker-compose.yml,./docker-compose.logging.yml,./nginx/conf.d/app.conf,./logging/loki-config.yml,./logging/config.alloy,./logging/grafana/provisioning/datasources/loki.yml,./scripts/tls/certbot-deploy-hook.sh,./scripts/tls/setup-tls.sh,./scripts/tls/domains.conf"
          target: "~/masjid-app"

      # Re-installed every deploy so the hook is versioned in git rather than
      # being a file that only exists on the box. Without it, certbot renews
      # certificates on disk and nginx keeps serving the old ones from memory
      # until they expire.
      - name: Converge certbot deploy hook
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e
            install -d /etc/letsencrypt/renewal-hooks/deploy
            install -m 0755 ~/masjid-app/scripts/tls/certbot-deploy-hook.sh \
                            /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
            chmod +x ~/masjid-app/scripts/tls/setup-tls.sh
            echo "deploy hook installed:"
            ls -l /etc/letsencrypt/renewal-hooks/deploy/

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            # Without set -e the script continues past a failed compose command
            # and exits with the status of `docker image prune` — which always
            # succeeds. A broken deploy would then be reported as green.
            set -eu

            cd ~/masjid-app

            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            # Secrets are fetched over this URL, so it should be HTTPS. It is a
            # repository secret rather than a literal so it can move without a
            # code change — the fallback preserves current behaviour.
            #
            # Set INFISICAL_DOMAIN to
            #   https://vault.masjid-app.isquaretechsolutions.com
            # AFTER scripts/tls/setup-tls.sh has expanded the certificate to
            # cover that hostname. Switching before then makes the Infisical CLI
            # reject an untrusted certificate and every deploy fails.
            export INFISICAL_DOMAIN=${{ secrets.INFISICAL_DOMAIN || 'http://72.62.6.65:8088' }}
            export INFISICAL_UNIVERSAL_AUTH_CLIENT_ID=${{ secrets.INFISICAL_CLIENT_ID }}
            export INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET=${{ secrets.INFISICAL_CLIENT_SECRET }}

            infisical run --env=dev --command="
              docker compose pull &&
              docker compose up -d --force-recreate --remove-orphans
            "

            docker image prune -f

      # A green deploy previously meant only "the commands ran". It now means
      # the backend actually came up and nginx is serving, so a broken release
      # fails the pipeline instead of passing silently.
      - name: Verify deployment health
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -eu
            cd ~/masjid-app

            # nginx is the single front door — if it is crash-looping, every
            # service is unreachable regardless of the backend's state.
            if [ "$(docker inspect -f '{{.State.Running}}' masjid-nginx 2>/dev/null || echo false)" != "true" ]; then
              echo "FAIL: masjid-nginx is not running"
              docker logs masjid-nginx --tail 40 2>&1 || true
              exit 1
            fi
            echo "ok: nginx running"

            for i in $(seq 1 30); do
              STATUS="$(docker inspect -f '{{.State.Health.Status}}' masjid-backend 2>/dev/null || echo unknown)"
              if [ "$STATUS" = "healthy" ]; then
                echo "ok: backend healthy"
                docker compose ps
                exit 0
              fi
              echo "  backend status=$STATUS (attempt $i/30)"
              sleep 5
            done

            echo "FAIL: backend did not become healthy within 150s"
            docker compose logs --tail=80 app
            exit 1

      # Deployed as a SEPARATE compose project (-p masjid-logging) from the same
      # directory. That is what keeps it safe from the app deploy's
      # --remove-orphans, which only removes containers labelled with the
      # masjid-app project.
      #
      # Deliberately `up -d` without --force-recreate: Compose then only touches
      # services whose definition changed, so ordinary app deploys leave Loki,
      # Alloy and Grafana running and keep ingesting.
      - name: Deploy logging stack
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -eu
            cd ~/masjid-app

            export INFISICAL_DOMAIN=${{ secrets.INFISICAL_DOMAIN || 'http://72.62.6.65:8088' }}
            export INFISICAL_UNIVERSAL_AUTH_CLIENT_ID=${{ secrets.INFISICAL_CLIENT_ID }}
            export INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET=${{ secrets.INFISICAL_CLIENT_SECRET }}

            # The app stack's network must exist first — the logging stack joins
            # it as external so nginx can reach Grafana by container name.
            NET="$(docker network ls --format '{{.Name}}' | grep -x 'masjid-app_masjid-network' || true)"
            if [ -z "$NET" ]; then
              echo "FAIL: expected network masjid-app_masjid-network not found. Available:"
              docker network ls --format '  {{.Name}}' | grep masjid || true
              exit 1
            fi

            # Grafana refuses to start with an empty admin password, and a
            # blank one would otherwise be a silently world-open dashboard.
            infisical run --env=dev --command='
              if [ -z "${GRAFANA_ADMIN_PASSWORD:-}" ]; then
                echo "FAIL: GRAFANA_ADMIN_PASSWORD is not set in Infisical";
                exit 1;
              fi;
              docker compose -p masjid-logging -f docker-compose.logging.yml pull &&
              docker compose -p masjid-logging -f docker-compose.logging.yml up -d
            '

            docker compose -p masjid-logging -f docker-compose.logging.yml ps

      # Non-blocking on purpose: logs going missing is bad, but it must never
      # fail a release of the donation app itself.
      - name: Verify logging stack
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -u
            for c in masjid-loki masjid-alloy masjid-grafana; do
              printf '  %-16s %s\n' "$c" \
                "$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo missing)"
            done
            echo "  loki ready: $(docker exec masjid-loki wget -qO- http://localhost:3100/ready 2>/dev/null || echo 'not ready')"
            echo "  containers Alloy is collecting:"
            docker exec masjid-loki wget -qO- 'http://localhost:3100/loki/api/v1/label/container/values' 2>/dev/null | head -c 400 || true
            echo
