name: Masjid App Build & Deploy

on:
  push:
    branches:
      - dev
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Deployment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/masjid-backend:dev-latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: Deployment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display Selected Environment
        run: |
          echo "Environment = ${{ github.event.inputs.environment }}"

      - name: Create application directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            mkdir -p ~/masjid-app/nginx/conf.d

      - name: Copy docker-compose and nginx config
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "./docker-compose.yml,./nginx/conf.d/app.conf,./scripts/tls/certbot-deploy-hook.sh,./scripts/tls/setup-tls.sh,./scripts/tls/domains.conf"
          target: "~/masjid-app"

      # Re-installed every deploy so the hook is versioned in git rather than
      # being a file that only exists on the box. Without it, certbot renews
      # certificates on disk and nginx keeps serving the old ones from memory
      # until they expire.
      - name: Converge certbot deploy hook
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e
            install -d /etc/letsencrypt/renewal-hooks/deploy
            install -m 0755 ~/masjid-app/scripts/tls/certbot-deploy-hook.sh \
                            /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
            chmod +x ~/masjid-app/scripts/tls/setup-tls.sh
            echo "deploy hook installed:"
            ls -l /etc/letsencrypt/renewal-hooks/deploy/

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            cd ~/masjid-app

            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            export INFISICAL_DOMAIN=http://72.62.6.65:8088
            export INFISICAL_UNIVERSAL_AUTH_CLIENT_ID=${{ secrets.INFISICAL_CLIENT_ID }}
            export INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET=${{ secrets.INFISICAL_CLIENT_SECRET }}

            infisical run --env=dev --command="
              docker compose pull &&
              docker compose up -d --force-recreate --remove-orphans
            "

            docker image prune -f
