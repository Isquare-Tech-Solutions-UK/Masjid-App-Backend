name: Dev build

# Every merge to dev builds the backend image and pushes it as
# ghcr.io/isquare-tech-solutions-uk/masjidguide-backend:dev.
#
# Pushing :dev deploys nothing. To run it, redeploy the dev stack in Portainer
# (masjid-guide-dev > Update the stack) with "Re-pull image" on. Masjid stacks
# never use :dev; they run a version published by release.yml.
#
# Only the :dev tag is pushed, no per-commit tag: every tagged version counts
# toward cleanup.yml's "keep 30" window, which is meant for releases. Each push
# leaves the previous dev build untagged, and cleanup.yml deletes those.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Only the newest merge matters: a newer push cancels a build still running.
concurrency:
  group: dev-build
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/isquare-tech-solutions-uk/masjidguide-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:dev
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Dev build"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image: \`$IMAGE:dev\`"
            echo ""
            echo "Nothing was deployed. Redeploy masjid-guide-dev in Portainer with \"Re-pull image\" on."
          } >> "$GITHUB_STEP_SUMMARY"
