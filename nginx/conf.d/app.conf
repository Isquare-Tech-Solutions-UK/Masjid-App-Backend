
# One server block per service, each on its own subdomain.
#
# All blocks intentionally reference the SAME certificate path. That single
# certificate carries every hostname as a SAN (see docs/dns-and-tls.md), which
# means nginx starts even before the cert has been expanded to cover the new
# names — you get a browser warning on the new subdomains until you run the
# certbot --expand command, instead of nginx refusing to boot.

# Reuse an inbound X-Request-Id when the caller supplies one, otherwise mint
# nginx's own $request_id. Either way the same id reaches the backend, which
# puts it in the MDC — so one id ties nginx, backend and frontend logs together.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Only send `Connection: upgrade` when the client actually asked to upgrade.
# Sending it unconditionally breaks keepalive on ordinary requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# JSON access logs so Alloy can ship them to Loki as queryable fields
# rather than as an opaque line. `host` distinguishes the subdomains.
log_format json_combined escape=json
    '{'
    '"time":"$time_iso8601",'
    '"host":"$host",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"requestId":"$req_id"'
    '}';

access_log /dev/stdout json_combined;
error_log  /dev/stderr warn;

# Shared TLS + proxy settings, included by every HTTPS block below.
# (Kept inline rather than in a separate file so only app.conf needs deploying.)

# ── HTTP: ACME challenge + redirect, for EVERY hostname ──────────────────────
# Catch-all on purpose: a new subdomain can be validated by certbot without
# touching this file first.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Frontend ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name masjid-app.isquaretechsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/masjid-app.isquaretechsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masjid-app.isquaretechsolutions.com/privkey.pem;

    location / {
        # The frontend runs in a separate compose project, so it is reached via
        # the host gateway rather than a container name. Requires the
        # extra_hosts entry on the nginx service in docker-compose.yml.
        proxy_pass http://host.docker.internal:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $req_id;

        # Next.js dev/HMR and any streaming responses
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ── Backend API ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.masjid-app.isquaretechsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/masjid-app.isquaretechsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masjid-app.isquaretechsolutions.com/privkey.pem;

    # Spring's multipart limit is 50MB total; keep nginx from rejecting first.
    client_max_body_size 50M;

    location / {
        proxy_pass http://app:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $req_id;
    }
}

# ── Grafana (log explorer) ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name logs.masjid-app.isquaretechsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/masjid-app.isquaretechsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masjid-app.isquaretechsolutions.com/privkey.pem;

    location / {
        # Resolved at request time through Docker's embedded DNS rather than at
        # startup: with a literal proxy_pass hostname, nginx refuses to start if
        # the logging stack is down, which would take every other site with it.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $grafana_upstream http://masjid-grafana:3000;
        proxy_pass $grafana_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana Live streams over websockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-running queries over full history
        proxy_read_timeout 300s;
    }
}

# ── Infisical (secrets manager) ──────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name vault.masjid-app.isquaretechsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/masjid-app.isquaretechsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masjid-app.isquaretechsolutions.com/privkey.pem;

    location / {
        # Infisical runs in its own stack; reached via the host gateway.
        proxy_pass http://host.docker.internal:8088;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ── MinIO S3 API (serves uploaded images to browsers) ────────────────────────
server {
    listen 443 ssl;
    server_name s3.masjid-app.isquaretechsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/masjid-app.isquaretechsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masjid-app.isquaretechsolutions.com/privkey.pem;

    # Object uploads pass through here; 0 disables the limit as S3 clients
    # handle their own chunking.
    client_max_body_size 0;

    location / {
        proxy_pass http://masjid-minio:9000;

        # MinIO validates S3 signatures against the Host header — it must be
        # passed through unmodified or uploads fail with SignatureDoesNotMatch.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# ── MinIO console (admin UI) ─────────────────────────────────────────────────
# Administrative. Consider restricting to known IPs — uncomment the allow/deny
# lines and put your office/home address in.
server {
    listen 443 ssl;
    server_name console.masjid-app.isquaretechsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/masjid-app.isquaretechsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masjid-app.isquaretechsolutions.com/privkey.pem;

    # allow 203.0.113.4;   # <- your IP
    # deny  all;

    location / {
        proxy_pass http://masjid-minio:9001;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}