# Reuse an inbound X-Request-Id when the caller supplies one, otherwise mint
# nginx's own $request_id. Either way the same id reaches the backend, which
# puts it in the MDC — so one id ties nginx, backend and frontend logs together.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

# JSON access logs so Alloy can ship them to Loki as queryable fields
# rather than as an opaque line.
log_format json_combined escape=json
    '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    # Named requestId (not request_id) to match the backend's MDC key, so one
    # LogQL query — | json | requestId="<id>" — spans nginx and the backend.
    '"requestId":"$req_id"'
    '}';

access_log /dev/stdout json_combined;
error_log  /dev/stderr warn;

server {
    listen 80;
    server_name masjid-app.isquaretechsolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name masjid-app.isquaretechsolutions.com;

    ssl_certificate /etc/letsencrypt/live/masjid-app.isquaretechsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masjid-app.isquaretechsolutions.com/privkey.pem;

    # Frontend
    location / {
        proxy_pass http://72.62.6.65:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
    }

    # Backend API
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
    }

    # Grafana log explorer.
    #
    # Resolved at request time through Docker's embedded DNS rather than at
    # startup: with a literal proxy_pass hostname, nginx refuses to start if
    # the logging stack is down, which would take the whole site with it.
    location /logs/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $grafana_upstream http://masjid-grafana:3000;
        proxy_pass $grafana_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana Live uses websockets for streaming/tailing log views.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long-running queries over full history.
        proxy_read_timeout 300s;
    }
}
